<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scotty Malcolm</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    /* alternating two‑column album layout */
    .album {
      display: flex;
      align-items: flex-start;
      gap: 4vw;
      margin-bottom: 8vh;
    }
    .album .album-image,
    .album .album-text {
      flex: 1 1 40%;
    }
    .album .album-image img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* alternate image/text order */
    .album:nth-of-type(even) {
      flex-direction: row-reverse;
    }
    @media (max-width: 768px) {
      .album {
        flex-direction: column !important;
      }
      .album .album-image,
      .album .album-text {
        flex: 1 1 100%;
      }
      .album .album-text {
        margin-top: 2vh;
      }
    }
  </style>
</head>
<body>
  <button id="toggleBtn">party mode on</button>
  <div style="margin-bottom: 2vh;"></div>

  <marquee behavior="scroll" direction="left">
    ,..,.,.,..,..,,..,,.,.,.,...,.THE NOTES,,.,.,.,.,..,.,.,.,..,,,
  </marquee>

  <div style="margin-bottom: 10vh;"></div>

  <div>
    <p>
      A B C D E F G
    </p>
  </div>

  <!-- Album 1 -->
  <div class="album">
    <div class="album-image">
      <a href="https://denizenrecords.bandcamp.com/album/1000-burgers"><strong>1,000 Burgers (2026)</strong></a>
      <img src="gifs/3dgifmaker44857.gif" alt="Notes Cover">
    </div>
    <div class="album-text">
      <p>I made this album in <br>
      September 2026<br>
      I was making a song everyday<br>
      and these are the songs that were<br>
     passable<br>
      <p>
    </div>
  </div>

  <div style="margin-bottom: 20vh;"></div>

  <div style="width: 50vw; margin: 0 auto; text-align: center;">
    return to <a href="music.html">MUSIC?</a>
  </div>
  <div style="width: 50vw; margin: 2vh auto; text-align: center;">
    return to <a href="index.html">HOME?</a>
  </div>

  <footer style="text-align: center; margin-top: 4vh;">© 2025 Scotty Malcolm</footer>
</body>


<script>
  const button = document.getElementById('toggleBtn');
  let intervalId = null;

  function getRandomColor() {
    const r = Math.floor(Math.random() * 256);
    const g = Math.floor(Math.random() * 256);
    const b = Math.floor(Math.random() * 256);
    return `rgb(${r}, ${g}, ${b})`;
  }

  button.addEventListener('click', () => {
    if (intervalId === null) {
      intervalId = setInterval(() => {
        document.body.style.backgroundColor = getRandomColor();
      }, 200);
      button.textContent = 'party mode off';
    } else {
      clearInterval(intervalId);
      intervalId = null;
      button.textContent = 'party mode on';
    }
  });
</script>

</html>
